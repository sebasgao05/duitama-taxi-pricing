name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  pull_request_target:
    branches: [main]

jobs:
  release-metadata:
    runs-on: ubuntu-latest
    # En pull_request_target usamos el código base (main), no la rama del PR
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      is_prerelease: ${{ steps.version.outputs.is_prerelease }}
    steps:
      - uses: actions/checkout@v6
      - id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" == *-* ]]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi

  test:
    runs-on: ubuntu-latest
    # Evitar doble ejecución: si es PR normal no correr pull_request_target y viceversa
    if: |
      (github.event_name == 'pull_request' && github.actor != 'dependabot[bot]') ||
      (github.event_name == 'pull_request_target' && github.actor == 'dependabot[bot]') ||
      github.event_name == 'push'
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    steps:
      # Para pull_request_target de Dependabot hacemos checkout del HEAD del PR de forma segura
      - name: Checkout PR head (Dependabot)
        if: github.event_name == 'pull_request_target' && github.actor == 'dependabot[bot]'
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Checkout (otros eventos)
        if: github.event_name != 'pull_request_target'
        uses: actions/checkout@v6

      # pnpm 11 requiere Node >=22.13 — setup-node debe ir ANTES de pnpm/action-setup
      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.1
          run_install: false

      - name: Configurar cache de pnpm
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run validate:version
      - run: pnpm run build:lambda
      - run: pnpm run test:coverage
      - name: Upload coverage
        if: env.CODECOV_TOKEN != ''
        uses: codecov/codecov-action@v5
        with:
          token: ${{ env.CODECOV_TOKEN }}
          files: ./coverage/lcov.info

  deploy-qa:
    needs: test
    runs-on: ubuntu-latest
    # PRs normales (no Dependabot) y PRs de Dependabot via pull_request_target
    if: |
      (github.event_name == 'pull_request' && github.actor != 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'pull_request_target' && github.actor == 'dependabot[bot]')
    environment: qa
    steps:
      - name: Checkout PR head (Dependabot)
        if: github.event_name == 'pull_request_target' && github.actor == 'dependabot[bot]'
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Checkout (PR normal)
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.1
          run_install: false

      - name: Configurar cache de pnpm
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run build:lambda
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      - uses: aws-actions/setup-sam@v2
      - run: sam build --skip-pull-image
      - run: sam deploy --config-env qa

  # Auto-merge del PR de Dependabot solo si QA pasó
  auto-merge-dependabot:
    needs: deploy-qa
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request_target' && github.actor == 'dependabot[bot]'
    permissions:
      pull-requests: write
      contents: write
    steps:
      - name: Auto-merge Dependabot PR
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --squash --auto

  # Bump de versión PATCH automático cuando Dependabot mergea a main
  bump-patch-dependabot:
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      startsWith(github.event.head_commit.message, 'chore(deps)')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.1
          run_install: false

      - name: Configurar cache de pnpm
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - name: Bump patch version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          pnpm run version:patch
          git add package.json
          git add src/version.ts 2>/dev/null || true
          git add src/swagger.yaml 2>/dev/null || true
          NEW_VERSION=$(node -p "require('./package.json').version")
          git commit -m "chore: bump version to $NEW_VERSION [skip ci]"
          git push origin main

  deploy-staging:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: staging
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.1
          run_install: false

      - name: Configurar cache de pnpm
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run build:lambda
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      - uses: aws-actions/setup-sam@v2
      - run: sam build --skip-pull-image
      - run: sam deploy --config-env staging

  deploy-production:
    needs: [deploy-staging, release-metadata]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && needs.release-metadata.outputs.is_prerelease == 'false'
    environment: production
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.1
          run_install: false

      - name: Configurar cache de pnpm
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run build:lambda
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      - uses: aws-actions/setup-sam@v2
      - run: sam build --skip-pull-image
      - run: sam deploy --config-env production

      - name: Update repository URL
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          API_URL=$(aws cloudformation describe-stacks \
            --stack-name duitama-taxi-pricing-production \
            --query "Stacks[0].Outputs[0].OutputValue" \
            --output text)
          gh repo edit --homepage "$API_URL/docs"

  create-prerelease:
    needs: [deploy-staging, release-metadata]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && needs.release-metadata.outputs.is_prerelease == 'true'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Create GitHub pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-metadata.outputs.tag }}
          VERSION: ${{ needs.release-metadata.outputs.version }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists."
            exit 0
          fi
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --notes "Pre-release $VERSION for validation before a stable API release." \
            --prerelease

  create-release:
    needs: [deploy-production, release-metadata]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && needs.release-metadata.outputs.is_prerelease == 'false'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-metadata.outputs.tag }}
          VERSION: ${{ needs.release-metadata.outputs.version }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists."
            exit 0
          fi
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --notes "Stable release $VERSION." \
            --latest
