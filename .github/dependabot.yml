version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: "chore(deps)"
    groups:
      dev-dependencies:
        patterns:
          - "@types/*"
          - "jest"
          - "ts-jest"
          - "ts-node-dev"
          - "typescript"
          - "supertest"
      production-dependencies:
        patterns:
          - "express*"
          - "helmet"
          - "morgan"
          - "dotenv"
          - "zod"
          - "@codegenie/*"
          - "yamljs"
