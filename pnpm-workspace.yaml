# pnpm-workspace.yaml
# Configuración del workspace para pnpm 11.
#
# allowBuilds: lista blanca de dependencias autorizadas a ejecutar
# build scripts (postinstall, etc.) durante la instalación.
# pnpm 11 bloquea todos los build scripts por defecto como medida de seguridad.
# Solo se aprueba lo estrictamente necesario y auditado.
allowBuilds:
  # Dependencia transitiva de herramientas de resolución de módulos.
  # Compila binarios nativos en la instalación -- auditado y aprobado.
  unrs-resolver: true

# overrides: fuerza versiones de dependencias transitivas para resolver
# vulnerabilidades de seguridad sin esperar actualizaciones upstream.
overrides:
  form-data: ">=4.0.6"
  qs: ">=6.15.2"
  "@babel/core": ">=7.29.1"
  js-yaml: ">=4.2.0"
